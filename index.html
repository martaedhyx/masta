<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asisten AI dengan Akses Internet</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            max-width: 820px;
            margin: 0 auto;
            padding: 20px;
            background: #0f172a;
            color: #e2e8f0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        h1 { font-size: 1.4rem; color: #38bdf8; margin-bottom: 4px; }
        .sub { font-size: 0.85rem; color: #94a3b8; margin-bottom: 18px; }
        #chat {
            flex: 1;
            background: #1e293b;
            border-radius: 12px;
            padding: 18px;
            overflow-y: auto;
            min-height: 320px;
            max-height: 60vh;
            border: 1px solid #334155;
        }
        .msg { margin-bottom: 14px; line-height: 1.55; white-space: pre-wrap; }
        .msg.user { text-align: right; color: #7dd3fc; }
        .msg.ai { color: #e2e8f0; }
        .msg.ai .label { color: #38bdf8; font-weight: 600; }
        .msg .label { display: block; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 3px; opacity: 0.8; }
        .status { font-size: 0.8rem; color: #fbbf24; margin: 8px 0; min-height: 1.2em; }
        .input-row { display: flex; gap: 10px; margin-top: 14px; }
        #prompt {
            flex: 1;
            padding: 12px 14px;
            border-radius: 10px;
            border: 1px solid #475569;
            background: #1e293b;
            color: #e2e8f0;
            font-size: 1rem;
            outline: none;
        }
        #prompt:focus { border-color: #38bdf8; }
        button {
            padding: 12px 22px;
            border-radius: 10px;
            border: none;
            background: #38bdf8;
            color: #0f172a;
            font-weight: 700;
            cursor: pointer;
            font-size: 1rem;
        }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .sources { font-size: 0.78rem; color: #94a3b8; margin-top: 6px; border-top: 1px dashed #334155; padding-top: 6px; }
        .sources a { color: #7dd3fc; text-decoration: none; }
        .sources a:hover { text-decoration: underline; }
    </style>
</head>
<body>

<h1>🌐 Asisten AI + Internet</h1>
<div class="sub">Model: KeylessAI · Pencarian: Tavily keyless · Tanpa API key</div>

<div id="chat"></div>
<div class="status" id="status"></div>

<div class="input-row">
    <input id="prompt" type="text" placeholder="Tanya apa saja, misal: berita terbaru AI hari ini..." autocomplete="off">
    <button id="send">Kirim</button>
</div>

<script>
(() => {
    const chatEl   = document.getElementById('chat');
    const promptEl = document.getElementById('prompt');
    const sendBtn  = document.getElementById('send');
    const statusEl = document.getElementById('status');

    // ==== KONFIGURASI ENDPOINT ====
    const KEYLESS_AI_URL = 'https://keylessai.thryx.workers.dev/v1/chat/completions';
    const TAVILY_URL     = 'https://api.tavily.com/search';
    // Proxy CORS publik untuk Tavily (karena Tavily tidak selalu mengirim header CORS)
    const CORS_PROXY     = 'https://api.allorigins.win/raw?url=';

    const MAX_HISTORY = 6; // simpan 6 pasang terakhir agar konteks tetap ringan
    let history = [];      // [{role:'user'|'assistant', content:'...'}]

    function addMessage(role, text, sources = []) {
        const div = document.createElement('div');
        div.className = `msg ${role === 'user' ? 'user' : 'ai'}`;

        const label = document.createElement('span');
        label.className = 'label';
        label.textContent = role === 'user' ? 'Kamu' : 'Asisten';
        div.appendChild(label);

        const content = document.createElement('span');
        content.textContent = text;
        div.appendChild(content);

        if (sources.length) {
            const srcDiv = document.createElement('div');
            srcDiv.className = 'sources';
            srcDiv.innerHTML = '<strong>Sumber:</strong> ' +
                sources.map((s, i) =>
                    `<a href="${s.url}" target="_blank" rel="noopener">[${i + 1}] ${s.title || s.url}</a>`
                ).join(' · ');
            div.appendChild(srcDiv);
        }

        chatEl.appendChild(div);
        chatEl.scrollTop = chatEl.scrollHeight;
    }

    function setStatus(msg) { statusEl.textContent = msg || ''; }
    function setLoading(on) {
        sendBtn.disabled = on;
        sendBtn.textContent = on ? '…' : 'Kirim';
        promptEl.disabled = on;
    }

    // ==== 1. CARI DI INTERNET (Tavily keyless) ====
    async function webSearch(query) {
        const body = { query: query, max_results: 3 };
        const target = `${TAVILY_URL}?${new URLSearchParams()}`; // dummy, kita POST
        // Karena Tavily POST + butuh header khusus, kita lewat proxy dengan method POST
        // allorigins /raw mendukung POST? Kita gunakan trik: kirim sebagai GET? Tidak.
        // Solusi: allorigins memiliki endpoint /raw yang bisa meneruskan POST jika kita kirim ke /raw?url=...
        // Namun allorigins /raw hanya GET. Kita pakai proxy lain yang mendukung POST: corsproxy.io
        // Fallback: kita coba fetch langsung dulu (mungkin CORS diizinkan), jika gagal pakai proxy.
        try {
            const direct = await fetch(TAVILY_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-Tavily-Access-Mode': 'keyless'
                },
                body: JSON.stringify(body)
            });
            if (direct.ok) return await direct.json();
        } catch (_) { /* lanjut ke proxy */ }

        // Fallback via corsproxy.io (mendukung POST)
        const proxyUrl = 'https://corsproxy.io/?' + encodeURIComponent(TAVILY_URL);
        const res = await fetch(proxyUrl, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-Tavily-Access-Mode': 'keyless'
            },
            body: JSON.stringify(body)
        });
        if (!res.ok) throw new Error('Gagal mengambil hasil pencarian');
        return await res.json();
    }

    // ==== 2. MINTA JAWABAN KE MODEL AI (KeylessAI) ====
    async function askAI(messages) {
        const res = await fetch(KEYLESS_AI_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                model: 'gpt-4o', // alias; KeylessAI akan route otomatis
                messages: messages,
                temperature: 0.7,
                max_tokens: 1024
            })
        });
        if (!res.ok) {
            const errText = await res.text().catch(() => '');
            throw new Error(`Model AI error (${res.status}). ${errText.slice(0, 120)}`);
        }
        const data = await res.json();
        return data.choices?.[0]?.message?.content?.trim() || '(Tidak ada jawaban)';
    }

    // ==== 3. ALUR UTAMA ====
    async function handleSend() {
        const text = promptEl.value.trim();
        if (!text) return;

        promptEl.value = '';
        addMessage('user', text);
        setLoading(true);

        try {
            // a) Cari web
            setStatus('🔎 Mencari di internet…');
            let searchResults = [];
            try {
                const sr = await webSearch(text);
                searchResults = (sr.results || []).slice(0, 3).map(r => ({
                    title: r.title || r.url,
                    url: r.url,
                    content: r.content || ''
                }));
            } catch (e) {
                console.warn('Pencarian gagal:', e);
                // Tetap lanjut tanpa hasil pencarian
            }

            // b) Susun prompt dengan konteks pencarian
            setStatus('🧠 Menyusun jawaban…');
            let systemPrompt = 'Kamu adalah asisten yang cerdas, ringkas, dan membantu. Jawab dalam bahasa Indonesia yang natural.';
            let userContent = text;

            if (searchResults.length) {
                const konteks = searchResults.map((r, i) =>
                    `[${i + 1}] ${r.title}\n${r.content}`
                ).join('\n\n');
                systemPrompt += ' Gunakan hasil pencarian web berikut sebagai referensi jika relevan. Jika tidak relevan, abaikan dan jawab dengan pengetahuanmu sendiri. Jangan mengarang sumber.';
                userContent = `Pertanyaan: ${text}\n\nHasil pencarian web terbaru:\n${konteks}\n\nJawablah berdasarkan pertanyaan dan hasil pencarian di atas. Sertakan referensi [1], [2], dst. jika kamu menggunakan informasi dari hasil pencarian.`;
            }

            // c) Gabung history + pesan baru
            const messages = [
                { role: 'system', content: systemPrompt },
                ...history,
                { role: 'user', content: userContent }
            ];

            const answer = await askAI(messages);

            // d) Tampilkan
            addMessage('assistant', answer, searchResults);

            // e) Simpan history (hanya pertanyaan asli + jawaban, tanpa prompt pencarian)
            history.push({ role: 'user', content: text });
            history.push({ role: 'assistant', content: answer });
            if (history.length > MAX_HISTORY * 2) history = history.slice(-MAX_HISTORY * 2);

            setStatus('');
        } catch (err) {
            console.error(err);
            addMessage('assistant', `⚠️ Maaf, terjadi kesalahan: ${err.message}`);
            setStatus('');
        } finally {
            setLoading(false);
            promptEl.focus();
        }
    }

    // ==== EVENT ====
    sendBtn.addEventListener('click', handleSend);
    promptEl.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            handleSend();
        }
    });

    // Sapaan awal
    addMessage('assistant', 'Halo! Aku asisten AI yang bisa mencari info terbaru dari internet. Silakan tanya apa saja.');
})();
</script>
</body>
</html>
